name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Q-learning convergence test
        run: node ql_core.test.js
      - name: Static checks (syntax, no AI tells)
        run: node ci/checks.js
